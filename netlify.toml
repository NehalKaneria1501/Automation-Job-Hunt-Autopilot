# Netlify Configuration for Job Hunt Autopilot
# Project: job-hunt-autopilot (https://app.netlify.com/projects/job-hunt-autopilot/overview)

[build]
  publish = "."
  command = ""

# Single Page Application (SPA) catch-all routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Cache Headers
[[headers]]
  for = "/*"
    [headers.values]
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"
      Content-Security-Policy = "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval' data: blob: chrome-extension:; frame-src * data: blob:; img-src * data: blob: https:; connect-src * https: wss:; font-src * data: https:;"

[[headers]]
  for = "/app.js"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"
